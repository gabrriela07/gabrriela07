<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Um fantasminha de fones de ouvido ouvindo música" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .note{font-family:"Segoe UI Symbol","Apple Symbols","DejaVu Sans",sans-serif;font-size:26px;fill:#22d3ee;opacity:0}
  </style>

  <!-- sombra -->
  <ellipse cx="400" cy="206" rx="46" ry="6" fill="#64748b" opacity="0.25">
    <animate attributeName="rx" values="46;38;46" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
    <animate attributeName="opacity" values="0.25;0.15;0.25" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- fantasma -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>

    <!-- corpo -->
    <path d="M350 100 A50 50 0 0 1 450 100 V158 A16.67 16.67 0 0 1 416.67 158 A16.67 16.67 0 0 1 383.33 158 A16.67 16.67 0 0 1 350 158 Z" fill="#c4b5fd"/>

    <!-- fone -->
    <path d="M341 110 A59 59 0 0 1 459 110" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
    <rect x="331" y="98" width="20" height="34" rx="8" fill="#22d3ee"/>
    <rect x="449" y="98" width="20" height="34" rx="8" fill="#22d3ee"/>

    <!-- olhinhos felizes -->
    <path d="M376 108 q7 -9 14 0" fill="none" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M410 108 q7 -9 14 0" fill="none" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M394 122 q6 6 12 0" fill="none" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- notinhas -->
  <text class="note" x="490" y="120">♪
    <animateTransform attributeName="transform" type="translate" values="0 0;12 -50" dur="3.6s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.3;1" dur="3.6s" begin="0s" repeatCount="indefinite"/>
  </text>
  <text class="note" x="515" y="140" style="font-size:20px">♫
    <animateTransform attributeName="transform" type="translate" values="0 0;-8 -50" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.3;1" dur="3.6s" begin="1.2s" repeatCount="indefinite"/>
  </text>
  <text class="note" x="300" y="120" style="font-size:22px">♪
    <animateTransform attributeName="transform" type="translate" values="0 0;-12 -50" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" keyTimes="0;0.3;1" dur="3.6s" begin="2.4s" repeatCount="indefinite"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
